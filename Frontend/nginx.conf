server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA React Router (ou équivalent) : toute route inconnue de Nginx doit
    # retomber sur index.html pour laisser le routeur côté client décider —
    # sans ça, un rafraîchissement de page sur /documents/123 par exemple
    # renverrait un 404 Nginx au lieu de l'application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques versionnés par Vite (hash dans le nom) : cache long
    # sans risque, un déploiement change le nom du fichier, jamais son contenu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # mime.types (fourni par l'image nginx de base) ne connaît que ".js" pour
    # application/javascript, pas ".mjs" — sans cette règle, ces fichiers
    # retombent sur default_type (application/octet-stream). Sans
    # conséquence pour un <script> classique, mais un Worker créé avec
    # {type: 'module'} (voir pdfjs-dist/PdfThumbnail.ts, worker de rendu PDF)
    # refuse de démarrer si le navigateur ne reçoit pas un type JavaScript
    # explicite — constaté en direct : le worker ne chargeait jamais, la
    # miniature de chaque carte PDF retombait donc systématiquement sur
    # l'icône générique de secours (previewsEchec), sans erreur visible côté
    # UI. Priorité sur /assets/ ci-dessus malgré l'ordre de déclaration :
    # une location regex l'emporte toujours sur une location prefixe.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA React Router (ou équivalent) : toute route inconnue de Nginx doit
    # retomber sur index.html pour laisser le routeur côté client décider —
    # sans ça, un rafraîchissement de page sur /documents/123 par exemple
    # renverrait un 404 Nginx au lieu de l'application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques versionnés par Vite (hash dans le nom) : cache long
    # sans risque, un déploiement change le nom du fichier, jamais son contenu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

{{/*
  Secrets générés une fois, puis JAMAIS régénérés.

  STORAGE_ENCRYPTION_KEY chiffre déjà des documents dès la première écriture
  dans MinIO — la régénérer au fil d'un `helm upgrade` rendrait TOUS les
  documents déjà archivés indéchiffrables, définitivement. C'est exactement
  le principe "figer à la création, ne jamais redériver" qui a guidé tout ce
  chart : `lookup` va lire le Secret existant s'il y en a un, et ne retombe
  sur une valeur aléatoire que s'il n'existe vraiment pas encore.

  Limite connue : `lookup` ne fonctionne que contre un cluster réel — il
  renvoie toujours vide sous `helm template` / `helm install --dry-run` sans
  contexte de cluster. Ne jugez jamais "ça régénère à chaque fois" à partir
  d'un dry-run : testez avec un vrai `helm upgrade` contre le cluster.
*/}}
{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $encKey := "" -}}
{{- $pgPassword := "" -}}
{{- $minioAccessKey := "" -}}
{{- $minioSecretKey := "" -}}
{{- $meiliMasterKey := "" -}}
{{- $jwtSecret := "" -}}
{{- if $existing -}}
{{- $encKey          = (b64dec (index $existing.data "STORAGE_ENCRYPTION_KEY")) -}}
{{- $pgPassword      = (b64dec (index $existing.data "DB_PASSWORD")) -}}
{{- $minioAccessKey  = (b64dec (index $existing.data "MINIO_ACCESS_KEY")) -}}
{{- $minioSecretKey  = (b64dec (index $existing.data "MINIO_SECRET_KEY")) -}}
{{- $meiliMasterKey  = (b64dec (index $existing.data "MEILI_MASTER_KEY")) -}}
{{- $jwtSecret        = (b64dec (index $existing.data "JWT_SECRET")) -}}
{{- else -}}
{{/* randBytes N renvoie déjà du base64 — exactement le format attendu par
     storage.encryption.key (AES-256, 32 octets encodés en Base64). Ne PAS
     ré-encoder par-dessus, ça casserait le décodage côté appli. */}}
{{- $encKey          = randBytes 32 -}}
{{- $pgPassword      = randAlphaNum 24 -}}
{{- $minioAccessKey  = randAlphaNum 20 -}}
{{- $minioSecretKey  = randAlphaNum 40 -}}
{{- $meiliMasterKey  = randAlphaNum 32 -}}
{{- $jwtSecret        = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  STORAGE_ENCRYPTION_KEY: {{ $encKey | quote }}
  DB_PASSWORD: {{ $pgPassword | quote }}
  MINIO_ACCESS_KEY: {{ $minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ $minioSecretKey | quote }}
  MEILI_MASTER_KEY: {{ $meiliMasterKey | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
{{- if .Values.polygon.enabled }}
  POLYGON_PRIVATE_KEY: {{ .Values.polygon.privateKey | quote }}
{{- end }}

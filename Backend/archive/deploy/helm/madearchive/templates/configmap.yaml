apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  DB_URL: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
  DB_USERNAME: {{ .Values.postgres.username | quote }}
  MINIO_URL: "http://{{ .Release.Name }}-minio:9000"
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  MEILISEARCH_HOST: "http://{{ .Release.Name }}-meilisearch:7700"
  REDIS_HOST: "{{ .Release.Name }}-redis"
  REDIS_PORT: "6379"
  GOTENBERG_URL: {{ .Values.shared.gotenbergUrl | quote }}
  OLLAMA_BASE_URL: {{ .Values.shared.ollamaUrl | quote }}
  FRONTEND_URL: {{ .Values.app.frontendUrl | quote }}
  JWT_EXPIRATION: {{ .Values.app.jwtExpiration | quote }}
  JWT_REFRESH_EXPIRATION: {{ .Values.app.jwtRefreshExpiration | quote }}
  HSM_KEYSTORE_PATH: "/app/hsm/{{ .Values.hsm.keystoreFilename }}"
{{- if .Values.polygon.enabled }}
  POLYGON_RPC_URL: {{ .Values.polygon.rpcUrl | quote }}
  POLYGON_CONTRACT_ADDRESS: {{ .Values.polygon.contractAddress | quote }}
{{- end }}

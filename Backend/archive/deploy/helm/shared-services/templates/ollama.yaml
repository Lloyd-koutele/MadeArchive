apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          # même montage à froid que le docker-compose actuel : le modèle
          # est tiré au premier démarrage puis reste sur le volume.
          command: ["/bin/sh", "-c"]
          args:
            - "ollama serve & sleep 10 && ollama pull {{ .Values.ollama.model }} && wait"
          ports: [{ containerPort: 11434 }]
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["ollama", "list"] }
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434

{{/*
  Symétrique du refus par défaut côté société : seuls les namespaces portant
  le label madearchive.io/societe (posé par le chart madearchive/) peuvent
  atteindre Gotenberg/Ollama — pas n'importe quel pod du cluster.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-societes-only
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: madearchive.io/societe, operator: Exists }

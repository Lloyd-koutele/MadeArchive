apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: gotenberg }
  template:
    metadata:
      labels: { app: gotenberg }
    spec:
      containers:
        - name: gotenberg
          image: {{ .Values.gotenberg.image }}
          ports: [{ containerPort: 3000 }]
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: gotenberg }
  ports:
    - port: 3000
      targetPort: 3000

# Configuration de l'application
spring.application.name=archive
server.port=8080

# Configuration de la base de données PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Configuration de la sécurité
spring.security.filter.order=10

# Upload de fichiers — les valeurs par défaut de Spring Boot (1 Mo/fichier, 10 Mo/requête)

spring.servlet.multipart.max-file-size=101MB
spring.servlet.multipart.max-request-size=2000MB

# Configuration JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configuration Jackson pour gérer les références circulaires
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration Jackson supplémentaire
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.deserialization.accept-single-value-as-array=true

# MinIO Configuration
minio.endpoint=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# Blockchain
blockchain.rpc-url=${POLYGON_RPC_URL}
blockchain.private-key=${POLYGON_PRIVATE_KEY}
blockchain.contract-address=${POLYGON_CONTRACT_ADDRESS}

# HSM fichier (KeyStore PKCS12 - clés privées de signature des éditeurs)
hsm.keystore-path=${HSM_KEYSTORE_PATH}
hsm.keystore-password=${HSM_KEYSTORE_PASSWORD}

# Chiffrement au repos des PDF/A archivés dans MinIO (AES-256-GCM)
storage.encryption.key=${STORAGE_ENCRYPTION_KEY}

#S3
#s3.bucket=${S3_BUCKET}
#s3.access-key=${S3_ACCESS_KEY}
#s3.secret-key=${S3_SECRET_KEY}
#s3.expiry-hours=${S3_EXPIRY_HOURS}

# S3/Minio provider
storage.provider=${STORAGE_PROVIDER}

# Tess4J
tesseract.data-path=${TESSERACT_DATA_PATH}
tesseract.custom-dictionary-path=${TESSERACT_CUSTOM_DICT_PATH:/tmp/tesseract-custom-dict}

#Ollama
ollama.base-url=${OLLAMA_BASE_URL}

#Meilisearch
meilisearch.host=${MEILISEARCH_HOST}
meilisearch.api-key=${MEILI_MASTER_KEY}

#LibreOffice
# Gotenberg (conteneur LibreOffice persistant, voir docker-compose.yml)
gotenberg.base-url=${GOTENBERG_URL:http://localhost:3000}
gotenberg.timeout-seconds=60

# URL publique du frontend — utilisée pour construire le lien encodé dans le
# QR code d'une attestation d'archivage (voir config.AppProperties)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Redis (cache — voir config.RedisCacheConfig). Défauts localhost:6379 pour le
# développement hors Docker (mêmes valeurs que redis-server par défaut).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}



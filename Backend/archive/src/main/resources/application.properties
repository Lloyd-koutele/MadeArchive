# Configuration de l'application
spring.application.name=archive
server.port=8080

# Configuration de la base de données PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database=POSTGRESQL
# validate (plus update) : Flyway est désormais la SEULE source de vérité du
# schéma (voir db/migration et son README) — Hibernate se contente de vérifier
# au démarrage que les entités correspondent au schéma, il ne le modifie plus
# jamais lui-même. Tout changement de colonne/table passe maintenant par une
# nouvelle migration Vx__....sql, jamais par une simple annotation JPA.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true
# defer-datasource-initialization=true RETIRÉ : nécessaire seulement quand Hibernate
# ddl-auto=update/create CRÉE les tables (schema.sql devait alors attendre que ce
# soit fait avant d'ajouter ses contraintes CHECK) — désormais Flyway crée tout,
# Hibernate ne fait plus que valider (ddl-auto=validate). Le garder provoquait un
# cycle de dépendances CIRCULAIRE au démarrage ("Circular depends-on relationship
# between 'flyway' and 'entityManagerFactory'", constaté en conditions réelles) :
# Spring Boot fait alors dépendre l'initialiseur SQL (schema.sql) de
# entityManagerFactory, ET entityManagerFactory de flyway, ET flyway finit par
# dépendre indirectement de l'initialiseur SQL — boucle. Sans ce flag, schema.sql
# dépend uniquement de Flyway (ordre normal, sans cycle), ce qui est tout ce dont
# il a besoin : les tables qu'il modifie existent déjà via les migrations Flyway.
spring.sql.init.mode=always

# Configuration de la sécurité
spring.security.filter.order=10

# Upload de fichiers — les valeurs par défaut de Spring Boot (1 Mo/fichier, 10 Mo/requête)

spring.servlet.multipart.max-file-size=101MB
spring.servlet.multipart.max-request-size=2000MB

# Nombre de fichiers max dans UNE requête multipart (ex. "choisir un dossier
# entier" à l'archivage) — c'est Tomcat, pas Spring, qui impose une limite ici,
# jamais remontée avant ce commit, sans rapport avec max-file-size/
# max-request-size ci-dessus. Constaté en conditions réelles (curl, vraies
# requêtes multipart) : DEUX réglages Tomcat s'appliquent en même temps, la
# limite effective étant le plus petit des deux — max-part-count (50 par
# défaut) ET max-parameter-count (1000 par défaut, compte aussi les
# paramètres classiques GET/POST, pas que les fichiers). N'en remonter qu'un
# laissait l'autre comme goulot silencieux (un lot de 1001 fichiers échouait
# encore avec max-part-count seul à 10000). Voir GlobalExceptionHandler pour
# le message renvoyé au client quand cette limite est quand même dépassée.
server.tomcat.max-part-count=10000
server.tomcat.max-parameter-count=10000

# Configuration JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# Flyway — AUPARAVANT INERTE (dépendance absente, voir build.gradle) malgré ces
# mêmes clés déjà présentes : l'auto-configuration Spring Boot de Flyway ne
# s'active que si la classe Flyway est sur le classpath. Maintenant réellement
# actif. baseline-on-migrate=true : sur la base existante (non vide, créée par
# ddl-auto=update jusqu'ici, sans table flyway_schema_history), Flyway crée
# silencieusement cette table et marque l'état actuel "baseline-version" (1 par
# défaut) SANS exécuter de script — seules les migrations > 1 (V2, ...) sont
# rejouées. Sur une base vide (ex. reset complet), ce mécanisme ne joue aucun
# rôle particulier : tout se rejoue simplement depuis V1 s'il en existe une.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Configuration Jackson pour gérer les références circulaires
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration Jackson supplémentaire
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.deserialization.accept-single-value-as-array=true

# MinIO Configuration
minio.endpoint=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# Blockchain
blockchain.rpc-url=${POLYGON_RPC_URL}
blockchain.private-key=${POLYGON_PRIVATE_KEY}
blockchain.contract-address=${POLYGON_CONTRACT_ADDRESS}

# HSM fichier (KeyStore PKCS12 - clés privées de signature des éditeurs)
hsm.keystore-path=${HSM_KEYSTORE_PATH}
hsm.keystore-password=${HSM_KEYSTORE_PASSWORD}

# Chiffrement au repos des PDF/A archivés dans MinIO (AES-256-GCM)
storage.encryption.key=${STORAGE_ENCRYPTION_KEY}

#S3
#s3.bucket=${S3_BUCKET}
#s3.access-key=${S3_ACCESS_KEY}
#s3.secret-key=${S3_SECRET_KEY}
#s3.expiry-hours=${S3_EXPIRY_HOURS}

# S3/Minio provider
storage.provider=${STORAGE_PROVIDER}

# Tess4J
tesseract.data-path=${TESSERACT_DATA_PATH}
tesseract.custom-dictionary-path=${TESSERACT_CUSTOM_DICT_PATH:/tmp/tesseract-custom-dict}

#Ollama — désormais OPTIONNEL (génération automatique de regex désactivée si
# absent et si aucune API LLM externe n'est configurée non plus, voir
# OllamaService/ExternalLlmProperties). Modèle configurable, aligné avec le
# téléchargement fait par le conteneur ollama au démarrage (voir docker-compose.yml).
ollama.base-url=${OLLAMA_BASE_URL:}
ollama.model=${OLLAMA_MODEL:qwen2.5-coder:14b}

# API LLM externe générique, alternative/complément à Ollama local (voir
# ExternalLlmProperties et OllamaService pour l'ordre de priorité et le format
# de requête attendu — "Chat Completions", compatible OpenAI/Groq/Together/
# Mistral/DeepSeek/OpenRouter/tout serveur auto-hébergé compatible). Vide par
# défaut : fonctionnalité entièrement optionnelle, aucune valeur requise.
llm.api-url=${LLM_API_URL:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}

# Horodatage RFC 3161 (TSA) — voir HorodatageProperties pour l'ordre de
# priorité (payant prioritaire dès que tsa-url-payant est renseignée, jamais
# de repli silencieux vers le gratuit en cas d'échec). Gratuit (FreeTSA)
# TOUJOURS disponible par défaut ; payant entièrement optionnel.
horodatage.tsa-url=${HORODATAGE_TSA_URL:http://freetsa.org/tsr}
horodatage.tsa-url-payant=${HORODATAGE_TSA_URL_PAYANT:}
horodatage.username=${HORODATAGE_USERNAME:}
horodatage.password=${HORODATAGE_PASSWORD:}

#Meilisearch
meilisearch.host=${MEILISEARCH_HOST}
meilisearch.api-key=${MEILI_MASTER_KEY}

#LibreOffice
# Gotenberg (conteneur LibreOffice persistant, voir docker-compose.yml)
gotenberg.base-url=${GOTENBERG_URL:http://localhost:3000}
gotenberg.timeout-seconds=60

# PDF/A — conversion réelle (LibreOffice via Gotenberg, sinon Ghostscript) puis
# validation veraPDF, contrôle des polices et de la lisibilité. Voir PdfAProperties.
# pdfa.partie : 2 (PDF/A-2b) ou 3 (PDF/A-3b).
pdfa.partie=${PDFA_PARTIE:3}
pdfa.ghostscript-chemin=${GHOSTSCRIPT_PATH:gs}
pdfa.ghostscript-timeout-secondes=120
pdfa.seuil-fidelite-texte=0.90

# Domaine public NU (sans "https://", sans port) — utilisé pour l'origine CORS
# et pour construire le lien encodé dans le QR code d'une attestation (voir
# config.AppProperties). MÊME valeur que traefik/dynamic.yml.template
# (Host(`...`)) : c'est justement le but, une seule source (.env) au lieu de
# deux copies désynchronisables.
app.app-domain=${APP_DOMAIN:localhost:5173}

# Origines CORS de confiance supplémentaires, séparées par des virgules —
# vide par défaut, sans effet sur un déploiement standard (voir
# config.AppProperties et security.SecurityConfig). Utile par ex. pour tester
# depuis un téléphone sur le même réseau via l'IP du serveur : ajouter
# "https://192.168.x.x:PORT" ici sans reconstruire l'image.
app.cors-additional-origins=${CORS_ADDITIONAL_ORIGINS:}

# Admin initial — voie AUTOMATISÉE, optionnelle (voir config.InitialAdminProperties
# et controller.SetupController pour la voie interactive/assistant web).
# Toutes absentes par défaut : aucune valeur en dur, contrairement à avant.
initial-admin.email=${INITIAL_ADMIN_EMAIL:}
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
initial-admin.nom=${INITIAL_ADMIN_NOM:}
initial-admin.prenom=${INITIAL_ADMIN_PRENOM:}
initial-admin.telephone=${INITIAL_ADMIN_TELEPHONE:}

# Redis (cache — voir config.RedisCacheConfig). Défauts localhost:6379 pour le
# développement hors Docker (mêmes valeurs que redis-server par défaut).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Chromium (conteneur dédié ghcr.io/browserless/chromium, piloté à distance —
# voir config.WebImportHeadlessProperties / service.document.HeadlessBrowserImportService
# / docker-compose.yml). Défaut localhost:3001 pour le développement hors
# Docker (port hôte du conteneur chromium dans docker-compose.yml — nécessite
# de lancer soi-même ce conteneur, ex. "docker compose up chromium").
web-import.headless.ws-endpoint=${CHROMIUM_WS_ENDPOINT:ws://localhost:3001/playwright/chromium}

# Import via lien web — chemin fichier direct/page (sans navigateur headless,
# voir config.WebImportHttpProperties / service.document.WebImportService).
# 100 → ~5 Go de pire cas pour cette fonctionnalité seule ; suppose un serveur
# dimensionné en conséquence pour TOUT le reste de la pile (voir Ollama
# notamment) — viser 16 Go de RAM, pas 8, si ce défaut est conservé.
web-import.http.max-concurrent=${WEB_IMPORT_HTTP_MAX_CONCURRENT:100}

# Export administratif de documents (migration/changement de système — voir
# config.DocumentExportProperties / service.document.DocumentExportService).
# Le ZIP généré contient du contenu DÉCHIFFRÉ : répertoire local au serveur,
# jamais MinIO, purgé automatiquement après retention-hours (ExportCleanupScheduler).
document-export.temp-dir=${DOCUMENT_EXPORT_TEMP_DIR:/tmp/madearchive-exports}
document-export.retention-hours=${DOCUMENT_EXPORT_RETENTION_HOURS:48}

# Export au format SEDA 2.1 (voir config.SedaProperties / service.document.SedaExportGenerationService).
# Valeurs du service d'archives DESTINATAIRE — les défauts sont des marqueurs à remplacer.
seda.archival-agency-identifier=${SEDA_ARCHIVAL_AGENCY:SERVICE_ARCHIVES_A_RENSEIGNER}
seda.archival-agreement=${SEDA_ARCHIVAL_AGREEMENT:ACCORD_VERSEMENT_A_RENSEIGNER}
seda.transferring-agency-default=${SEDA_TRANSFERRING_AGENCY_DEFAULT:MADEARCHIVE}
seda.appraisal-rule-prefix=${SEDA_APPRAISAL_RULE_PREFIX:DUA-}

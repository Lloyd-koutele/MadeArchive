plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'smart'
version = '0.0.1-SNAPSHOT'

ext {
	testcontainersVersion = '1.20.4'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot - Core
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// Tests (scope testImplementation)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers — PostgreSQL éphémère pour les tests d'intégration (voir
	// src/test/.../integration). Version épinglée explicitement : le BOM
	// spring-boot-dependencies ne résout pas org.testcontainers:* tout seul
	// ici (testé — version vide sans ce testcontainersVersion).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// PKI - génération de certificats auto-signés pour le "HSM" fichier (KeyStore PKCS12)
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
	
	// Base de données
	runtimeOnly 'org.postgresql:postgresql'

	// Cache (Redis) — voir config.RedisCacheConfig
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	
	// Stockage objet
	implementation 'io.minio:minio:8.5.17'
	
	// AWS S3
    implementation 'software.amazon.awssdk:s3:2.25.15'
    implementation 'software.amazon.awssdk:s3-transfer-manager:2.25.15'

	
	// HTTP Client
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'

	// Parsing HTML — extraction des liens de documents pour l'import via lien web
	implementation 'org.jsoup:jsoup:1.17.2'

	// Navigateur headless — repli pour l'import via lien web quand la page dépend
	// du JavaScript pour afficher son contenu (ex. dossier Google Drive public),
	// voir service.document.HeadlessBrowserImportService. Version alignée avec
	// le conteneur ghcr.io/browserless/chromium (docker-compose.yml) — le
	// protocole de connexion "playwright.chromium().connect(...)" est un
	// protocole interne à Playwright, PAS rétro/avant-compatible entre versions
	// éloignées (vérifié : la 1.49.0 échoue à l'établissement de connexion
	// contre ce conteneur, qui n'annonce supporter que 1.58.2 → 1.62.1 sur son
	// endpoint /meta). Si ce conteneur change de version supportée à l'avenir,
	// remonter cette version en conséquence.
	implementation 'com.microsoft.playwright:playwright:1.62.0'

	// Web3 (si nécessaire)
	implementation 'org.web3j:core:4.10.3'
	
	// Configuration d'environnement
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'
	
	// OCR et Traitement de documents
	implementation 'org.apache.tika:tika-core:2.9.1'
	implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'
	implementation 'net.sourceforge.tess4j:tess4j:5.11.0'


	// Tika
    implementation 'org.apache.tika:tika-core:2.9.1'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'
    
    // PDFBox — version 2.x obligatoire pour compatibilité avec Tika 2.9.1
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'

    // Exclure PDFBox 3.x si importé transitivement
    configurations.all {
        resolutionStrategy {
            force 'org.apache.pdfbox:pdfbox:2.0.31'
        }
    }

    // ZXing — génération du QR code de l'attestation d'archivage (voir
    // service.document.AttestationPdfService)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
	

	// Recherche
	implementation 'com.meilisearch.sdk:meilisearch-java:0.11.0'
	
	// Excel et CSV
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'com.opencsv:opencsv:5.9'

	// Test
	implementation 'org.springframework:spring-test'

	// Env
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'

	//Ollama
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	//JSON
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

// Trois catégories de test, séparées par tag JUnit 5 (@Tag) plutôt que par
// package — voir 5.10 du mémoire. Chacune produit son propre rapport HTML
// (build/reports/tests/<nom-de-tâche>) et son propre XML pour la CI :
//   - test            : unitaires — rapides, aucune dépendance externe
//   - integrationTest : Testcontainers (PostgreSQL éphémère) — nécessite Docker
//   - performanceTest : charge/concurrence — plus lentes, exécutées à part
tasks.named('test') {
	useJUnitPlatform {
		// full-context : ArchiveApplicationTests, nécessite l'environnement
		// complet (MinIO/Redis/Meilisearch/Ollama/HSM/secrets) — voir sa Javadoc.
		excludeTags 'integration', 'performance', 'full-context'
	}
}

tasks.register('integrationTest', Test) {
	description = "Tests d'intégration (Testcontainers — nécessite Docker)"
	group = 'verification'
	// Un Test enregistré à la main ne pointe pas automatiquement vers le
	// sourceSet 'test' (contrairement à la tâche 'test' préconfigurée par le
	// plugin java) — sans ces deux lignes, la tâche tourne sur NO-SOURCE.
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
}

tasks.register('performanceTest', Test) {
	description = 'Tests de performance/charge (sans serveur live)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'performance'
	}
	shouldRunAfter test
}

// Tess4J/JNA cherche libtesseract.dylib dans les emplacements système standards
// (/usr/lib, le dossier du JDK...) mais PAS /opt/homebrew/lib — où Homebrew installe
// tesseract sur Apple Silicon (ARM64). Sans ce chemin explicite, tout traitement OCR
// échoue avec UnsatisfiedLinkError dès le premier appel, quel que soit le fichier.
// Sans effet sur Linux/Docker (le chemin n'existe simplement pas, JNA continue sa
// recherche normale dans les emplacements standards).
tasks.named('bootRun') {
	jvmArgs '-Djna.library.path=/opt/homebrew/lib'
}
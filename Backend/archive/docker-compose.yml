services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: madearchive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Optionnel (voir OllamaService/ExternalLlmProperties — génération automatique de
  # regex désactivée si absent et si aucune API LLM externe n'est configurée non
  # plus). Ne démarre PAS avec un simple "docker compose up" : nécessite le profil
  # "ollama" (COMPOSE_PROFILES=ollama dans .env, ou "docker compose --profile ollama
  # up -d") — évite de retenir 10 Go de RAM et de télécharger le modèle (9 Go) à
  # quelqu'un qui préfère une API externe ou pas de LLM du tout.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    mem_limit: 10g
    cpus: 5
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Le téléchargement du modèle ne doit JAMAIS faire tomber le serveur : avec l'ancien "pull && wait", un registre
    # injoignable (timeout réseau passager) faisait sortir le conteneur en erreur — même quand le modèle (9 Go) était
    # déjà dans le volume. Maintenant : on ne télécharge que si le modèle est ABSENT, avec plusieurs essais espacés, et le
    # serveur reste de toute façon en route (le "$$" est l'échappement Compose du "$" du shell).
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        SERVEUR=$$!
        for i in $$(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 2; done
        MODELE="$${OLLAMA_MODEL:-qwen2.5-coder:14b}"
        if ollama list | grep -q "^$$MODELE"; then
          echo "[ollama] modèle $$MODELE déjà présent, rien à télécharger"
        else
          for essai in 1 2 3 4 5; do
            ollama pull "$$MODELE" && break
            echo "[ollama] téléchargement de $$MODELE échoué (essai $$essai/5), nouvel essai dans 60 s"
            sleep 60
          done
        fi
        wait $$SERVEUR
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 30s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    # LibreOffice ouvre les documents des utilisateurs : un fichier piégé (bombe de décompression, document démesuré) ne
    # doit pouvoir consommer que CE conteneur, pas la machine. Les contrôles faits en amont par l'application
    # (ControleTypeFichierService) sont la première barrière, ces plafonds la seconde.
    mem_limit: 3g
    cpus: 2.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3

  chromium:
    image: ghcr.io/browserless/chromium:v2.56.0
    container_name: madearchive-chromium
    mem_limit: 1g
    cpus: 1.0
    # Réseau ISOLÉ : Chromium exécute le code de pages tierces (import par lien). Il ne partage donc AUCUN réseau avec
    # MinIO, PostgreSQL, Redis, Meilisearch, Ollama ou Gotenberg — seulement avec "app", qui le pilote. Même si une page
    # contournait le filtre de requêtes de l'application (HeadlessBrowserImportService.nouveauContexte), il n'y aurait
    # rien d'interne à atteindre. L'accès Internet sortant reste, c'est son rôle.
    networks:
      - import_isole
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TOKEN: ${CHROMIUM_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/pressure?token=$$TOKEN"]
      interval: 30s
      timeout: 20s
      retries: 3

  traefik:
    image: ghcr.io/lloyd-koutele/madearchive-traefik:latest
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./traefik/dynamic.yml.template:/etc/traefik/dynamic-template/dynamic.yml.template:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - traefik_certs:/letsencrypt
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--ping=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:

    image: ghcr.io/lloyd-koutele/madearchive-frontend:latest
    container_name: madearchive-frontend

  app:

    image: ghcr.io/lloyd-koutele/madearchive-app:latest
    container_name: madearchive-app
    # Réseau normal (base, stockage, recherche...) + réseau isolé partagé avec Chromium, pour le piloter.
    networks:
      - default
      - import_isole

    env_file:
      - .env
    # "ollama" volontairement ABSENT d'ici : il est optionnel (voir plus haut, profil
    # "ollama") — app ne doit jamais attendre après un service qui peut ne pas exister
    # du tout dans le déploiement courant. Sans OLLAMA_BASE_URL/LLM_API_URL configurée,
    # la génération automatique de regex se désactive simplement (voir OllamaService),
    # aucun impact sur le reste de l'application.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromium:
        condition: service_healthy
    environment:

      DB_URL: jdbc:postgresql://postgres:5432/madearchive
      TESSERACT_DATA_PATH: /usr/share/tessdata
      # Surchargeable depuis .env : vide (OLLAMA_BASE_URL=) pour désactiver
      # explicitement Ollama même si le conteneur tourne (profil "ollama" actif),
      # ex. le temps de tester une API externe sans arrêter le conteneur.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHROMIUM_WS_ENDPOINT: ws://chromium:3000/playwright/chromium?token=${CHROMIUM_TOKEN}
      MINIO_URL: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
      HSM_KEYSTORE_PATH: /app/hsm/editors-keystore.p12
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_DOMAIN: ${APP_DOMAIN:-localhost:5173}
    volumes:
      - hsm_data:/app/hsm

volumes:
  postgres_data:
  minio_data:
  meilisearch_data:
  ollama_data:
  hsm_data:
  traefik_certs:

networks:
  # Voir le service "chromium" : réseau où ne vit que le navigateur d'import, avec "app".
  import_isole:
    driver: bridge
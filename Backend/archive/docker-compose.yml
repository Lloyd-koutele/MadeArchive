services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - /data # <--- VOLUME ANONYME : Supprimé automatiquement au "docker compose down"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /meili_data # <--- VOLUME ANONYME : Réindexation automatique au redémarrage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # <--- VOLUME NOMMÉ : On le garde pour ne pas perdre le LLM
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull qwen2.5-coder:3b && wait"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3000:3000"
    # Conteneur persistant : convertit les documents (Office/image → PDF) via
    # LibreOffice en interne, sans jamais redémarrer de processus par fichier.
    # Remplace l'ancien pool LibreOffice in-process (JODConverter) — libère
    # la RAM/CPU de LibreOffice du conteneur de l'appli, partageable par
    # plusieurs instances de l'appli si besoin de scaler horizontalement.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    # Pas de volume : c'est un cache, pas une source de vérité — perdre son
    # contenu au redémarrage est acceptable et même sain (voir RedisCacheConfig).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build: .
    container_name: madearchive-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TESSERACT_DATA_PATH: /usr/share/tessdata
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT: http://minio:9000
      HSM_KEYSTORE_PATH: /app/hsm/editors-keystore.p12
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - hsm_data:/app/hsm # <--- VOLUME NOMMÉ : le HSM fichier doit survivre aux redéploiements

volumes:
  ollama_data:
  hsm_data:
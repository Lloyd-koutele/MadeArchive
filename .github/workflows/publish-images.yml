name: Publier les images (ghcr.io)

# Déclenché par un tag Git de version (ex: v1.2.0 → git push --tags),
# PAS à chaque push sur main — un correctif tout juste poussé n'est pas
# forcément prêt pour les déploiements existants qui font
# `docker compose pull` (voir DEPLOYMENT.md, section 9). Taguer une
# release est un geste explicite qui documente aussi ce qui est publié
# (l'historique des tags = l'historique des versions déployables).
# "Run workflow" (workflow_dispatch) reste disponible en secours, par ex.
# pour republier la même version après un souci d'infra ghcr.io.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # En dur, en minuscules : GHCR exige un nom d'image tout en minuscules,
  # mais github.repository_owner reflète la casse réelle du compte
  # ("Lloyd-koutele") — l'utiliser tel quel aurait échoué au push.
  IMAGE_APP: ghcr.io/lloyd-koutele/madearchive-app
  IMAGE_FRONTEND: ghcr.io/lloyd-koutele/madearchive-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compiler le .jar backend
        working-directory: Backend/archive
        run: ./gradlew bootJar -x test

      - name: Déterminer la version à publier
        id: version
        # Sur un push de tag (v1.2.0), on publie CETTE version explicitement,
        # en plus de latest et du sha — c'est ce que DEPLOYMENT.md
        # recommandera d'épingler dans docker-compose.yml pour un
        # déploiement en production (jamais "latest" en dur, pour pouvoir
        # revenir en arrière). Sur un déclenchement manuel hors tag, on
        # republie seulement latest + sha (pas de nouveau numéro de version).
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Déclenchement manuel hors tag : pas de numéro de version réel,
            # on retombe sur un identifiant traçable plutôt que de laisser
            # ce 3e tag vide (invalide en syntaxe "image:tag").
            echo "version=manual-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU : émule arm64 sur ce runner amd64, pour construire les DEUX
      # architectures dans la même image publiée — nécessaire pour qu'une VM
      # Apple Silicon (Multipass sur Mac M1/M2/M3, arm64 nativement) puisse
      # la tirer aussi bien qu'un VPS x86 classique. Sans ça : "no matching
      # manifest for linux/arm64/v8", constaté en testant sur une VM Multipass.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build + push — backend (app)
        uses: docker/build-push-action@v6
        with:
          context: Backend/archive
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:${{ steps.version.outputs.version }}

      - name: Build + push — frontend
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.version }}
